name: CI

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - name: gofmt
        run: |
          unformatted=$(gofmt -l ./cmd ./internal)
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - run: go vet ./...

      - name: Test with coverage
        run: |
          go test -coverprofile=cover.out ./...
          go tool cover -func=cover.out | tail -1

      # The parsers fold a stream into shared accumulators, and the CLI writes
      # while it reads. Both are worth the race detector.
      - name: Test with the race detector
        run: go test -race ./...

      - run: go build ./...

      # No dependencies is a property worth defending: it is why the binary is
      # static, small and auditable, and why the image needs no base at all. A
      # stray require would end that quietly.
      - name: Still zero dependencies
        run: |
          if [ -f go.sum ] && [ -s go.sum ]; then
            echo "::error::go.sum is non-empty — edgemix is meant to have no dependencies"
            cat go.sum
            exit 1
          fi
          if grep -qE '^\s*(require|replace)\b' go.mod; then
            echo "::error::go.mod declares requirements — edgemix is meant to have no dependencies"
            cat go.mod
            exit 1
          fi

      # edgemix reads files and nothing else. An import of net/http or os/exec
      # would change what it is safe to run against production logs, so it is a
      # build failure rather than a review comment.
      - name: Still no network and no subprocesses
        run: |
          if grep -rnE '"(net|net/http|os/exec|net/url)"' cmd internal --include='*.go' | grep -v '_test.go'; then
            echo "::error::edgemix must not open sockets or run programs"
            exit 1
          fi

  backlog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint the backlog
        run: ./scripts/backlog.sh lint
      - name: ROADMAP.md is in sync with BACKLOG.md
        run: ./scripts/backlog.sh check
      - name: The roadmap generator and the linter
        run: sh scripts/backlog_test.sh
      - name: The issue planner
        run: sh scripts/backlog_issues_test.sh

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The markdown renderer behind the docs site
        run: sh scripts/site_test.sh
      - name: The site builds and every internal link resolves
        run: ./scripts/site.sh check
      # The logo is generated from one geometry in scripts/logo.sh. A hand-edited
      # SVG, or a lockup that drifted from the mark, is a stale file rather than a
      # broken one — so it is a gate, the same way ROADMAP.md is.
      - name: The logo generator
        run: sh scripts/logo_test.sh
      - name: The committed SVGs match the geometry
        run: ./scripts/logo.sh check
      # The Homebrew formula is generated at release time from the checksums of
      # the archives. Its generator is tested here, because the release run is
      # not the place to discover that a checksum lookup silently returned
      # nothing.
      - name: The Homebrew formula generator
        run: sh scripts/brew_test.sh

  # Three workflows now — CI, Pages and Release — and nothing else reads them.
  # actionlint catches a bad expression, a wrong action input and (via
  # shellcheck) a mistake in a `run` block, which are otherwise found by tagging
  # a release and watching it fail.
  actions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
      - run: go install github.com/rhysd/actionlint/cmd/actionlint@latest
      - run: actionlint .github/workflows/*.yml

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...

  build-matrix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -trimpath -o /dev/null ./cmd/edgemix

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image and run it over a log
        run: |
          docker build -t edgemix:test --build-arg VERSION=ci-${{ github.sha }} .
          mkdir -p /tmp/logs
          printf '10.0.0.9:1 [19/Aug/2026:18:06:38.001] fe be/s1 0/0/0/12/13 200 100 - - ---- 1/1/0/0/0 0/0 "GET / HTTP/1.1"\n' > /tmp/logs/edge.log
          docker run --rm -v /tmp/logs:/logs:ro edgemix:test analyze /logs/edge.log
